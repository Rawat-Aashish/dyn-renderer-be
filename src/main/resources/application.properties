spring.application.name=dynamic-form-builder

# Secrets and machine-specific values live in application-local.properties (project root, git-ignored)
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/dynamic_form_builder
spring.datasource.username=postgres

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.expiration-minutes=60

# Empty means no browser origin is allowed; override in application-local.properties
app.cors.allowed-origins=
app.seed.enabled=false

# Uploaded files are kept on the local disk in this folder (git-ignored), relative to where the app is started
app.upload.dir=uploads
# Hard cap for one uploaded file; a FILE_UPLOAD field can only lower it (1 to 10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
